name: Deploy to DigitalOcean Droplet

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy to Droplet
      run: |
        ssh root@${{ secrets.DROPLET_IP }} "
          if [ -d /var/www/soundwave ]; then 
            cd /var/www/soundwave && git pull origin production; 
          else 
            git clone https://github.com/YOUR_USERNAME/YOUR_REPOSITORY.git /var/www/soundwave;
          fi
        "
