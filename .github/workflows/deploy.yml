name: Deploy to Heroku

on:
  push:
    branches:
      - production

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install frontend dependencies
      run: |
        npm install
        npm run build
      working-directory: ./soundwave_frontend

    - name: Collect static files
      env:
        ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS}}
        CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        DEBUG: ${{ secrets.DEBUG }}
        DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
        EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
        EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
        EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        MAPBOX_API_KEY: ${{ secrets.MAPBOX_API_KEY }}
        MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
      run: python ./soundwave_backend/manage.py collectstatic --noinput

    - name: Deploy to Heroku
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        HEROKU_APP_NAME: "soundwave"
      run: |
        git push heroku https://heroku:{{ env.HEROKU_API_KEY }}@git.heroku.com/${{ env.HEROKU_APP_NAME }}.git HEAD:master
